meta:
  name: reachability
  description: 正向连通性：同网络站点互通、BUM、公网

# 源地址绑定（-I <地址>）而不是网卡名：每个 macvlan 端点独立路由表，
# 只有绑定源地址才会走对应的策略路由表。

cases:
  - name: l3vpn-net1-bj-sh
    tags: [core, l3]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::10
        expect: pass

  - name: l3vpn-net1-bj-tjn
    tags: [core, l3]
    requires_sites: [tjn]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:14::10
        expect: pass

  - name: l3vpn-net1-bj-jnn
    tags: [core, l3]
    requires_sites: [jnn]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:23::10
        expect: pass

  - name: l3vpn-net1-bj-host1-ep2
    requires_hosts: 2
    tags: [core, l3, multihost]
    description: 同一主机两个 macvlan 端点之间可以互通
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:1::11
        expect: pass

  - name: l3vpn-net1-bj-host2
    requires_hosts: 2
    tags: [core, l3, multihost]
    description: 同站点两台主机的端点经 S1 二层互通
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:1::20
        expect: pass

  - name: l3vpn-net1-bj-to-sh-host2
    requires_hosts: 2
    tags: [core, l3, multihost]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::21
        expect: pass

  - name: l3vpn-net1-bj2-sh2
    requires_hosts: 2
    tags: [core, l3, multihost]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_2
        iface: 240a:a806:1:1::20
        target: 240a:a806:1:2::20
        expect: pass

  - name: l2vpn-net3-bj-host1-ep2
    requires_hosts: 2
    tags: [core, l2, multihost]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::101
        expect: pass

  - name: l2vpn-net3-bj-host2
    requires_hosts: 2
    tags: [core, l2, multihost]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::102
        expect: pass

  - name: l2vpn-net3-bj-to-sh-host2
    requires_hosts: 2
    tags: [core, l2, multihost]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::107
        expect: pass

  - name: l3vpn-net2-bj-sh
    tags: [core, l3]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:2:1::10
        target: 240a:a806:2:2::10
        expect: pass

  - name: l2vpn-net3-bj-sh
    tags: [core, l2]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::104
        expect: pass

  - name: vxlan-intra-site
    tags: [core, l3, vxlan]
    requires_hosts: 2
    description: 同站点跨 PM 的 VM 通信走 VXLAN（VNI = 网络 ID），隧道在本机 veth 上自环
    steps:
      - type: exec
        node: cl_bj_1
        command: sh -c 'rm -f /tmp/vxcap.pcap; setsid timeout 8 tcpdump -i any -U -s0 -w /tmp/vxcap.pcap "udp port 4789" >/dev/null 2>&1 & sleep 1; echo CAPTURE_STARTED'
        expect_contains: CAPTURE_STARTED
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:1::20
        expect: pass
      - type: sleep
        seconds: 3
      - type: exec
        node: cl_bj_1
        command: sh -c 'tcpdump -r /tmp/vxcap.pcap -nn 2>/dev/null | grep -q VXLAN && tcpdump -r /tmp/vxcap.pcap -nn 2>/dev/null | grep -qE "vni 1(,|$)" && echo VXLAN_OK'
        expect_contains: VXLAN_OK

  - name: qinq-access-double-tag
    tags: [core, l3, packet, qinq]
    requires_sites: [sh]
    requires_access_vtep: true
    description: 经 Linux VTEP 的 L3 切片在 VTEP↔E 段是 QinQ 双层 tag（外层 3500 + 内层切片 VLAN）
    steps:
      - type: exec
        node: V_bj
        command: sh -c 'rm -f /tmp/qinq.pcap; setsid timeout 8 tcpdump -i V_bj-eth1 -U -s0 -w /tmp/qinq.pcap "vlan 3500" >/dev/null 2>&1 & sleep 1; echo CAPTURE_STARTED'
        expect_contains: CAPTURE_STARTED
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::10
        expect: pass
      - type: sleep
        seconds: 3
      - type: exec
        node: V_bj
        command: sh -c 'tcpdump -r /tmp/qinq.pcap -nn -e -vv 2>/dev/null | grep -q "vlan 3500.*vlan 3501" && echo QINQ_OK'
        expect_contains: QINQ_OK

  - name: vxlan-e-checksum-shim
    tags: [core, l3, packet, shim]
    requires_sites: [sh]
    requires_access_vtep: false
    description: E（BMv2）直接终结 VXLAN，tc/eBPF shim 把 IPv6/UDP 校验和补齐（udp sum ok）
    steps:
      - type: exec
        node: cl_bj_1
        command: sh -c 'rm -f /tmp/shim.pcap; setsid timeout 10 tcpdump -i u4000 -U -s0 -w /tmp/shim.pcap "udp port 4789" >/dev/null 2>&1 & sleep 1; echo CAPTURE_STARTED'
        expect_contains: CAPTURE_STARTED
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::10
        expect: pass
      - type: sleep
        seconds: 3
      - type: exec
        node: cl_bj_1
        command: sh -c 'tcpdump -r /tmp/shim.pcap -nn -vv 2>/dev/null | grep -qE "fd00:0:1:8::1[^ ]*\.4789 > .*udp sum ok" && echo SHIM_OK'
        expect_contains: SHIM_OK

  - name: l2-access-vxlan
    tags: [core, l2, packet, vxlan]
    requires_sites: [sh]
    description: L2VPN 的接入段也用 VXLAN（VNI = 网络 ID），E 直接终结后走 SRv6
    steps:
      - type: exec
        node: cl_bj_1
        command: sh -c 'rm -f /tmp/l2vx.pcap; setsid timeout 10 tcpdump -i u4000 -U -s0 -w /tmp/l2vx.pcap "udp port 4789" >/dev/null 2>&1 & sleep 1; echo CAPTURE_STARTED'
        expect_contains: CAPTURE_STARTED
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::104
        expect: pass
      - type: sleep
        seconds: 3
      - type: exec
        node: cl_bj_1
        command: sh -c 'tcpdump -r /tmp/l2vx.pcap -nn -vv 2>/dev/null > /tmp/l2vx.txt; grep -qE "vni 3(,|$)" /tmp/l2vx.txt && grep -q "udp sum ok" /tmp/l2vx.txt && echo L2VXLAN_OK'
        expect_contains: L2VXLAN_OK

  - name: srv6-te-waypoint
    tags: [core, l3, te]
    requires_sites: [sh, jnn]
    description: 静态 TE 路径经济南 E 中转，waypoint 上 segmentsLeft 1→0 并改写 DA
    steps:
      - type: exec
        node: C_jnn
        command: sh -c 'rm -f /tmp/te.pcap; setsid timeout 10 tcpdump -i any -U -s0 -w /tmp/te.pcap "ip6 and proto 43" >/dev/null 2>&1 & sleep 1; echo CAPTURE_STARTED'
        expect_contains: CAPTURE_STARTED
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::10
        expect: pass
      - type: sleep
        seconds: 3
      - type: exec
        node: C_jnn
        command: sh -c 'tcpdump -r /tmp/te.pcap -nn >/tmp/te.txt 2>/dev/null; grep -Eq "fd00:0:1:1::1:1 > fd00:0:23:1::1:1.*segleft=1" /tmp/te.txt && grep -Eq "fd00:0:1:1::1:1 > fd00:0:2:1::1:1.*segleft=0" /tmp/te.txt && echo TE_OK'
        expect_contains: TE_OK

  - name: l2-tunnel-no-inner-vlan
    tags: [core, l2, packet]
    requires_sites: [sh]
    description: 隧道内层不带业务 VLAN，E 解封装后按 VSI 重新打上
    steps:
      - type: exec
        node: C_bj
        command: sh -c 'rm -f /tmp/l2cap.pcap; setsid timeout 8 tcpdump -i any -U -s0 -w /tmp/l2cap.pcap "ip6 and proto 43 and src host fd00:0:1:1::2:3" >/dev/null 2>&1 & sleep 1'
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::104
        expect: pass
      - type: sleep
        seconds: 3
      - type: exec
        node: C_bj
        command: tcpdump -r /tmp/l2cap.pcap -nn -vv
        expect_contains: "echo request"
        expect_not_contains: "vlan"

  - name: l2vpn-net3-bj-tjn
    tags: [core, l2]
    requires_sites: [tjn]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::134
        expect: pass

  - name: bum-net3
    tags: [core, l2]
    requires_sites: [sh]
    description: 链路本地组播必须绑网卡而不是源地址，否则内核选不到出接口
    steps:
      - type: ping
        node: cl_bj_1
        iface: ep_bj_1_1_3
        target: ff02::1
        count: 3
        min_received: 1
        max_loss: 100
        expect: pass

  - name: public-fix
    tags: [core, public]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 2001:255:0:100::2000
        expect: pass

meta:
  name: reachability
  description: 正向连通性：同网络站点互通、BUM、公网

# 源地址绑定（-I <地址>）而不是网卡名：每个 macvlan 端点独立路由表，
# 只有绑定源地址才会走对应的策略路由表。

cases:
  - name: l3vpn-net1-bj-sh
    tags: [core, l3]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::10
        expect: pass

  - name: l3vpn-net1-bj-tjn
    tags: [core, l3]
    requires_sites: [tjn]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:14::10
        expect: pass

  - name: l3vpn-net1-bj-jnn
    tags: [core, l3]
    requires_sites: [jnn]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:23::10
        expect: pass

  - name: l3vpn-net1-bj-host1-ep2
    requires_hosts: 2
    tags: [core, l3, multihost]
    description: 同一主机两个 macvlan 端点之间可以互通
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:1::11
        expect: pass

  - name: l3vpn-net1-bj-host2
    requires_hosts: 2
    tags: [core, l3, multihost]
    description: 同站点两台主机的端点经 S1 二层互通
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:1::20
        expect: pass

  - name: l3vpn-net1-bj-to-sh-host2
    requires_hosts: 2
    tags: [core, l3, multihost]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 240a:a806:1:2::21
        expect: pass

  - name: l3vpn-net1-bj2-sh2
    requires_hosts: 2
    tags: [core, l3, multihost]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_2
        iface: 240a:a806:1:1::20
        target: 240a:a806:1:2::20
        expect: pass

  - name: l2vpn-net3-bj-host1-ep2
    requires_hosts: 2
    tags: [core, l2, multihost]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::101
        expect: pass

  - name: l2vpn-net3-bj-host2
    requires_hosts: 2
    tags: [core, l2, multihost]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::102
        expect: pass

  - name: l2vpn-net3-bj-to-sh-host2
    requires_hosts: 2
    tags: [core, l2, multihost]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::107
        expect: pass

  - name: l3vpn-net2-bj-sh
    tags: [core, l3]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:2:1::10
        target: 240a:a806:2:2::10
        expect: pass

  - name: l2vpn-net3-bj-sh
    tags: [core, l2]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::104
        expect: pass

  - name: l2vpn-net3-bj-tjn
    tags: [core, l2]
    requires_sites: [tjn]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: 240a:a806:3:1::134
        expect: pass

  - name: bum-net3
    tags: [core, l2]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:3:1::100
        target: ff02::1
        count: 3
        min_received: 1
        max_loss: 100
        expect: pass

  - name: public-fix
    tags: [core, public]
    steps:
      - type: ping
        node: cl_bj_1
        iface: 240a:a806:1:1::10
        target: 2001:255:0:100::2000
        expect: pass

meta:
  name: isolation
  description: 负向隔离：跨网络必须 100% 丢包

cases:
  - name: iso-l3-net1-to-net2
    tags: [core, isolation]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj
        iface: v3501
        target: 240a:a806:2:2::10
        expect: fail

  - name: iso-l3-net1-to-l2
    tags: [core, isolation]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj
        iface: v3501
        target: 240a:a806:3:1::11
        expect: fail

  - name: iso-l2-net3-to-net4
    tags: [core, isolation]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_bj
        iface: v3503
        target: 240a:a806:4:1::11
        expect: fail

  - name: iso-l3-net2-to-net1
    tags: [core, isolation]
    requires_sites: [sh]
    steps:
      - type: ping
        node: cl_sh
        iface: v3502
        target: 240a:a806:1:1::10
        expect: fail

meta:
  name: isolation
  description: 负向隔离：跨网络必须 100% 丢包

cases:
  - name: iso-l3-net1-to-net2
    tags: [core, isolation]
    requires_sites: [sh]
    steps:
      - type: exec
        node: cl_bj
        command: ip -6 route get 240a:a806:2:2::10 from 240a:a806:1:1::10
        expect_not_contains: unreachable
      - type: ping
        node: cl_bj
        iface: v3501
        target: 240a:a806:2:2::10
        expect: fail

  - name: iso-l3-net1-to-l2
    tags: [core, isolation]
    requires_sites: [sh]
    steps:
      - type: exec
        node: cl_bj
        command: ip -6 route get 240a:a806:3:1::11 from 240a:a806:1:1::10
        expect_not_contains: unreachable
      - type: ping
        node: cl_bj
        iface: v3501
        target: 240a:a806:3:1::11
        expect: fail

  - name: iso-l2-net3-to-net4
    tags: [core, isolation]
    requires_sites: [sh]
    description: 主机回落到主表默认路由，报文在 E 的 VRF 被丢弃
    steps:
      - type: exec
        node: cl_bj
        command: ip -6 route get 240a:a806:4:1::11 from 240a:a806:3:1::10
        expect_not_contains: unreachable
      - type: ping
        node: cl_bj
        iface: 240a:a806:3:1::10
        target: 240a:a806:4:1::11
        expect: fail

  - name: iso-l3-net2-to-net1
    tags: [core, isolation]
    requires_sites: [sh]
    description: 用源地址绑定，确保报文真的发出并在 E 的 VRF 被丢弃
    steps:
      - type: exec
        node: cl_sh
        command: ip -6 route get 240a:a806:1:1::10 from 240a:a806:2:2::10
        expect_not_contains: unreachable
      - type: ping
        node: cl_sh
        iface: 240a:a806:2:2::10
        target: 240a:a806:1:1::10
        expect: fail

        contains: [3501, 3502, 3503, 3504]
      - type: ovs_trunks
        switch: S2_tjn
        peer: A_tjn
        contains: [3500, 3901]
        not_contains: [3501, 3502, 3503, 3504, 3900]

  - name: vlan-policy-jnn
    tags: [core, vlan]
    requires_sites: [jnn]
